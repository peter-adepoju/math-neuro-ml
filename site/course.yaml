# Course-level content for the MAMBA website. Edit freely: the site is rebuilt from this file and from content/.
title: "MAMBA: Mathematical Sciences for Brain Data"
short_title: "MAMBA"
tagline: "The mathematics behind neural data and machine learning, learned in Python on real recordings."
description: >-
  A course in the mathematics that computational neuroscience and machine learning are built on: linear algebra,
  calculus, probability and differential equations. Every idea is introduced through a neuroscience question, worked
  through in Python, and tested on real recordings from mouse brains and single neurons. No previous course in
  any of these subjects is assumed.
repo: "peter-adepoju/math-neuro-ml"
branch: "main"
site_url: "https://peter-adepoju.github.io/math-neuro-ml/"

