<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAMBA interactive figure</title>
<!--
  Standalone, isolated renderer for a single MAMBA interactive figure or animation.
  Lives at /math-neuro-ml/static/widget.html and is opened from links such as:
     static/widget.html?lesson=01&ix=span-basis&t=Span%20and%20basis
     static/widget.html?lesson=01&plotly=cell032_1&t=3D%20state%20space
  It reuses the course's own ix framework (js/ix/lib.js + js/ix/<slug>.js) and
  Plotly, mounting ONLY the requested figure. Styled as a modal so it reads like
  an overlay on the ACNEI lesson; "Close" runs history.back() to return to the
  exact spot the reader left.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="./css/site.css">
<!-- KaTeX JS must load before the ix widgets mount so their math labels render (not raw LaTeX). -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  html,body{margin:0;min-height:100%;background:#0b0e14}
  .mx-backdrop{position:fixed;inset:0;background:rgba(8,10,14,.9);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .mx-card{background:var(--panel,#111827);color:var(--fg,#e5e7eb);border:1px solid rgba(255,255,255,.14);border-radius:14px;max-width:980px;width:100%;max-height:94vh;overflow:auto;padding:16px 20px 22px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .mx-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
  .mx-title{font:600 15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;opacity:.95}
  .mx-close{flex:none;background:transparent;border:1px solid rgba(255,255,255,.28);color:inherit;border-radius:9px;padding:6px 13px;cursor:pointer;font:600 14px system-ui}
  .mx-close:hover{background:rgba(255,255,255,.1)}
  .mx-stage{min-height:200px}
  .plotly-holder{min-height:480px}
  .mx-msg{font:500 14px/1.5 system-ui;opacity:.85;padding:30px 4px}
  .mx-msg a{color:var(--accent,#8ab4ff)}
</style>
</head>
<body>
<div class="mx-backdrop">
  <div class="mx-card">
    <div class="mx-bar">
      <div class="mx-title" id="mx-title">Interactive figure</div>
      <button class="mx-close" type="button" id="mx-close">&times; Close</button>
    </div>
    <div class="mx-stage" id="mx-stage"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var P = new URLSearchParams(location.search);
  var lesson = (P.get("lesson") || "").replace(/[^0-9]/g, "");
  var ixName = P.get("ix");
  var plotly = P.get("plotly");
  var titleTxt = P.get("t");
  var LESSON_PAGE = "../lessons/lesson" + lesson + ".html";

  var titleEl = document.getElementById("mx-title");
  var stage = document.getElementById("mx-stage");
  if (titleTxt) titleEl.textContent = titleTxt;

  // Close returns to the exact scroll position on the referring (ACNEI) page.
  document.getElementById("mx-close").addEventListener("click", function () {
    if (history.length > 1) history.back();
    else window.close();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (history.length > 1) history.back(); } });

  function fail(msg) {
    stage.innerHTML = '<div class="mx-msg">' + msg +
      ' <br><br>You can view it in context on the <a href="' + LESSON_PAGE + '">full lesson page</a>.</div>';
  }
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = function () { rej(new Error("load " + src)); };
      document.head.appendChild(s);
    });
  }

  if (!lesson || (!ixName && !plotly)) {
    fail("No figure was specified.");
    return;
  }

  if (ixName) {
    // Interactive ix widget: load the framework + this lesson's registrations, then mount one.
    var holder = document.createElement("div");
    holder.className = "ix";
    holder.setAttribute("data-ix", ixName);
    stage.appendChild(holder);
    loadScript("./js/ix/lib.js")
      .then(function () { return loadScript("./js/ix/lesson" + lesson + ".js"); })
      .then(function () {
        try { if (window.IX && IX.mountAll) IX.mountAll(); } catch (e) {}
        if (!holder.querySelector("svg")) fail("This interactive figure could not be loaded here.");
      })
      .catch(function () { fail("This interactive figure could not be loaded here."); });
  } else {
    // Plotly animation: load Plotly, fetch the figure JSON, render it (with frames if present).
    var ph = document.createElement("div");
    ph.className = "plotly-holder";
    stage.appendChild(ph);
    loadScript("https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js")
      .then(function () { return fetch("../assets/lesson" + lesson + "/" + plotly + ".json"); })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (fig) {
        var cfg = { responsive: true, displaylogo: false, scrollZoom: true };
        return Plotly.newPlot(ph, fig.data || [], fig.layout || {}, cfg).then(function () {
          if (Array.isArray(fig.frames) && fig.frames.length) return Plotly.addFrames(ph, fig.frames);
        });
      })
      .catch(function () { fail("This animation could not be loaded here."); });
  }
})();
</script>
</body>
</html>
