# Builds the course website from site/ and publishes it with GitHub Pages.
# One-time set-up: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build and publish the course website
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown-it-py mdit-py-plugins pyyaml jinja2
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
